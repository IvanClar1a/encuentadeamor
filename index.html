<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para vos ❤️</title>
    <!-- Usamos Tailwind CSS para darle estilo rápido -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Agregamos una transición para que el movimiento de los botones sea fluido */
        .evasive-btn {
            transition: top 0.2s ease, left 0.2s ease;
            position: relative; /* Posición inicial */
        }
    </style>
</head>
<body class="bg-pink-50 h-screen flex flex-col items-center justify-center overflow-hidden font-sans">

    <!-- Contenedor principal -->
    <div class="text-center z-10 p-8 md:p-12 bg-white rounded-3xl shadow-2xl border-2 border-pink-200 w-11/12 max-w-2xl">
        <h1 class="text-3xl md:text-5xl font-bold text-pink-600 mb-10">¿Cuánto me extrañas? 🥺</h1>

        <!-- Formulario configurado con Formspree para enviarte el mail -->
        <!-- Reemplazá TU_ID_DE_FORMSPREE con el código que te da la página -->
        <form action="https://formspree.io/f/mwlvrayw" method="POST" id="loveForm">
            
            <!-- Datos ocultos que te van a llegar al mail -->
            <input type="hidden" name="Respuesta" value="¡Apretó el botón de que te extraña MUCHO! ❤️">
            <input type="hidden" name="_replyto" value="ivanclaria11@gmail.com">

            <div class="flex flex-wrap gap-4 justify-center items-center relative h-32" id="button-container">
                
                <!-- Botones que se escapan (funcionan con mouse y con el dedo en el celular) -->
                <button type="button" class="evasive-btn bg-gray-200 text-gray-700 font-semibold py-3 px-6 rounded-full hover:bg-gray-300 shadow-sm" onmouseover="moverBoton(this)" ontouchstart="moverBoton(this)">Nada</button>
                
                <button type="button" class="evasive-btn bg-gray-200 text-gray-700 font-semibold py-3 px-6 rounded-full hover:bg-gray-300 shadow-sm" onmouseover="moverBoton(this)" ontouchstart="moverBoton(this)">Poco</button>
                
                <button type="button" class="evasive-btn bg-gray-200 text-gray-700 font-semibold py-3 px-6 rounded-full hover:bg-gray-300 shadow-sm" onmouseover="moverBoton(this)" ontouchstart="moverBoton(this)">Muy poco</button>

                <!-- El único botón que se puede apretar -->
                <button type="submit" class="bg-pink-500 text-white font-bold py-3 px-8 rounded-full hover:bg-pink-600 transform hover:scale-110 transition-transform shadow-lg shadow-pink-300 text-lg z-50">Mucho 🥰</button>
            </div>
        </form>
    </div>

    <script>
        function moverBoton(btn) {
            // Cambiamos la posición a fixed para que flote por toda la pantalla
            btn.style.position = 'fixed';

            // Calculamos el espacio disponible para que el botón no se salga de la pantalla
            const maxX = window.innerWidth - btn.clientWidth;
            const maxY = window.innerHeight - btn.clientHeight;

            // Generamos coordenadas X e Y aleatorias
            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);

            // Aplicamos las nuevas coordenadas
            btn.style.left = randomX + 'px';
            btn.style.top = randomY + 'px';
        }

        // Le mostramos un cartelito lindo cuando logra apretar el botón correcto
        document.getElementById('loveForm').addEventListener('submit', function(e) {
            alert('¡Yo también te extraño mucho! ❤️ (Mensaje enviado a Iván)');
        });
    </script>
</body>
</html>
